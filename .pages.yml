# Pages CMS configuration for henrikhillerstrom.com
# Docs: https://pagescms.org/docs/configuration/

media:
  input: assets/images
  output: /assets/images

content:
  - name: home
    label: Home page
    type: file
    path: index.md
    fields:
      - { name: title, label: Browser tab title, type: string }
      - { name: heading, label: Main heading, type: string }
      - { name: lead, label: Introduction line, type: text }
      - { name: intro, label: Introduction text, type: rich-text }
      - { name: portrait, label: Portrait photo, type: image }
      - { name: portrait_alt, label: Portrait description (for screen readers), type: string }
      - { name: projects_heading, label: Projects heading, type: string }
      - { name: projects_intro, label: Projects introduction, type: rich-text }
      - { name: together_heading, label: Working together heading, type: string }
      - { name: together_text, label: Working together text, type: rich-text }

  - name: about
    label: About page
    type: file
    path: about.md
    fields:
      - { name: title, label: Page heading, type: string }
      - { name: lead, label: Introduction line, type: text }
      - { name: image, label: Photo, type: image }
      - { name: image_alt, label: Photo description (for screen readers), type: string }
      - name: facts
        label: In brief
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - { name: conviction, label: Closing line, type: text }
      - { name: body, label: Main text, type: rich-text }

  - name: projects
    label: Projects
    type: collection
    path: _projects
    filename: "{fields.title}.md"
    view:
      fields: [title, theme, order]
      primary: title
    fields:
      - { name: title, label: Project name, type: string, required: true }
      - { name: order, label: Position on the home page (1 = first), type: number }
      - { name: theme, label: Theme, type: string }
      - { name: summary, label: Short description (home page and page intro), type: text }
      - { name: stage, label: Stage, type: string }
      - { name: progress, label: Where it stands, type: string, list: true }
      - { name: looking_for, label: Looking for, type: string, list: true }
      - { name: website, label: Website address, type: string }
      - { name: website_label, label: Website name shown on the button, type: string }
      - { name: image, label: Image, type: image }
      - { name: image_alt, label: Image description (for screen readers), type: string }
      - { name: image_caption, label: Image caption, type: string }
      - { name: body, label: Detailed description, type: rich-text }

  - name: contact
    label: Contact details
    type: file
    path: _data/contact.yml
    format: yaml
    fields:
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone (as displayed), type: string }
      - { name: whatsapp, label: WhatsApp link, type: string }
      - { name: linkedin, label: LinkedIn link, type: string }
      - { name: location, label: Location line, type: string }
      - { name: languages, label: Working languages, type: string }
