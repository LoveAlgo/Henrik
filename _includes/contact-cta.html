{% assign contact = site.data.contact %}
<div class="actions">
  <a class="btn btn--green" href="mailto:{{ contact.email }}">Email me</a>
  <a class="btn btn--outline" href="{{ contact.linkedin }}">Connect on LinkedIn</a>
  <a class="text-link" href="{{ contact.whatsapp }}">Message on WhatsApp</a>
</div>
